# Plays the game like a person after every merge to main
# (scripts/perf/playtest.gd): a new town, a road, a grid, a county road
# join, zoning, then top speed while the camera tours. Alone and in a
# region with grown neighbors on the desktop build (no window), and alone
# in the browser build in Chromium. Every frame is timed; the summary page
# shows the worst freezes and what caused them, and the run turns red when
# a budget in tools/playtest/budgets.json breaks (a freeze long enough to
# look like a crash, memory that would sink an 8 GB Mac).
name: Play-through

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds at top speed
        default: "300"

permissions:
  contents: read

concurrency:
  group: playtest
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  SECONDS_RUN: ${{ github.event.inputs.seconds || '300' }}

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-perf
          key: godot-${{ env.GODOT_VERSION }}-perf

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-perf && cd ~/godot-perf
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot

      - name: Play alone and in a region
        run: |
          ~/godot-perf/godot --headless --import >/dev/null 2>&1 || true
          tools/playtest/run_desktop.sh ~/godot-perf/godot out "$SECONDS_RUN"

      - name: Check the budgets
        run: python3 tools/playtest/check.py tools/playtest/budgets.json out/alone.json out/region.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-desktop-${{ github.sha }}
          path: out/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates && cd ~/godot-cache
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qj templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d templates
          rm templates.tpz

      - name: Install templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot-cache/templates/* "$dest/"

      # The same slim engine the preview ships, when it's built.
      - name: Slim engine
        id: slim
        uses: actions/cache/restore@v4
        with:
          path: ~/slim-engine
          key: slim-web-${{ env.GODOT_VERSION }}-${{ hashFiles('web/engine/custom.py') }}

      - name: Use the slim engine
        if: steps.slim.outputs.cache-hit == 'true'
        run: sed -i "s|^custom_template/release=.*|custom_template/release=\"$HOME/slim-engine/web_nothreads_release.zip\"|" export_presets.cfg

      - name: Export for the web
        run: |
          ~/godot-cache/godot --headless --import >/dev/null 2>&1 || true
          mkdir -p build/web
          ~/godot-cache/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Play in Chromium
        run: |
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p out
          # The browser draws in software here, so a shorter run says enough.
          node tools/playtest/web_playtest.mjs build/web 120 out/web.json || true

      - name: Check the budgets
        run: python3 tools/playtest/check.py tools/playtest/budgets.json out/web.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-web-${{ github.sha }}
          path: out/
