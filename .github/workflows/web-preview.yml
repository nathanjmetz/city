# Builds the browser version of the game and publishes it to GitHub Pages
# on every push to main. Preview: https://nathanjmetz.github.io/city/
name: Web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates && cd ~/godot-cache
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qj templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d templates
          rm templates.tpz

      - name: Install templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot-cache/templates/* "$dest/"

      - name: Run tests
        run: |
          ~/godot-cache/godot --headless --import
          ~/godot-cache/godot --headless -s tests/test_roads.gd
          ~/godot-cache/godot --headless -s tests/test_sim.gd
          ~/godot-cache/godot --headless -s tests/test_advisor.gd
          ~/godot-cache/godot --headless -s tests/test_road_tools.gd
          ~/godot-cache/godot --headless -s tests/test_grid_fill.gd
          ~/godot-cache/godot --headless -s tests/test_move_it.gd
          ~/godot-cache/godot --headless -s tests/test_traffic.gd
          ~/godot-cache/godot --headless -s tests/test_net.gd
          ~/godot-cache/godot --headless -s tests/test_vehicles.gd
          ~/godot-cache/godot --headless -s tests/test_seasons.gd
          ~/godot-cache/godot --headless -s tests/test_balance.gd
          ~/godot-cache/godot --headless -s tests/test_audio.gd
          ~/godot-cache/godot --headless -s tests/test_transit.gd
          ~/godot-cache/godot --headless -s tests/test_loading.gd
          ~/godot-cache/godot --headless -s tests/test_terrain.gd
          ~/godot-cache/godot --headless -s tests/test_permits.gd
          ~/godot-cache/godot --headless -s tests/test_lots.gd
          ~/godot-cache/godot --headless -s tests/test_hubs.gd
          ~/godot-cache/godot --headless -s tests/test_warehouses.gd
          ~/godot-cache/godot --headless -s tests/test_parks.gd
          ~/godot-cache/godot --headless -s tests/test_vegetation.gd
          ~/godot-cache/godot --headless -s tests/test_education.gd

      - name: Stamp the build
        run: |
          # Shown in the game's corner so you can tell which version you're playing.
          printf 'const BUILD := "%s  %s"\n' "${GITHUB_SHA::7}" "$(date -u '+%b %d %H:%M UTC')" > scripts/build_info.gd

      - name: Export for the web
        run: |
          mkdir -p build/web
          ~/godot-cache/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Give files versioned names
        run: |
          # Browsers cache the game files, so each build gets new file names
          # and a refresh always loads the latest version.
          v=${GITHUB_SHA::8}
          cd build/web
          for f in index.*; do
            [ "$f" = index.html ] && continue
            mv "$f" "index-$v.${f#index.}"
          done
          sed -i -E "s/index\.(js|pck|wasm|audio|icon|apple-touch-icon|png)/index-$v.\1/g; s/\"executable\":\"index\"/\"executable\":\"index-$v\"/" index.html
          grep -q "index-$v.js" index.html
          grep -q "\"executable\":\"index-$v\"" index.html
          ls

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
