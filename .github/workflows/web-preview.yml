# Builds the browser version of the game and publishes it to GitHub Pages
# on every push to main. Preview: https://nathanjmetz.github.io/city/
name: Web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Many threads merge minutes apart: let a running build finish and deploy
  # (only the newest waiting one runs next), or nothing would ever ship.
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test once held the queue for over an hour and no merge could
    # deploy behind it: stop a stuck build so the next one runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates && cd ~/godot-cache
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qj templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d templates
          rm templates.tpz

      - name: Install templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot-cache/templates/* "$dest/"

      # The slim web engine from the Web engine workflow, when it's built.
      - name: Slim engine
        id: slim
        uses: actions/cache/restore@v4
        with:
          path: ~/slim-engine
          key: slim-web-${{ env.GODOT_VERSION }}-${{ hashFiles('web/engine/custom.py') }}

      - name: Use the slim engine
        if: steps.slim.outputs.cache-hit == 'true'
        run: |
          sed -i "s|^custom_template/release=.*|custom_template/release=\"$HOME/slim-engine/web_nothreads_release.zip\"|" export_presets.cfg
          grep -n custom_template/release export_presets.cfg

      - name: Run tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          # A test fails on a script error too, even if its checks all passed.
          run_test() {
            ~/godot-cache/godot --headless -s "$1" 2>&1 | tee /tmp/test.log
            if grep -q "SCRIPT ERROR" /tmp/test.log; then
              echo "::error::$1 hit a script error"
              return 1
            fi
          }
          ~/godot-cache/godot --headless --import
          run_test tests/test_roads.gd
          run_test tests/test_junction_marks.gd
          run_test tests/test_country_roads.gd
          run_test tests/test_sim.gd
          run_test tests/test_water.gd
          run_test tests/test_advisor.gd
          run_test tests/test_build_menus.gd
          run_test tests/test_first_town.gd
          run_test tests/test_pad.gd
          run_test tests/test_camera_zoom.gd
          run_test tests/test_undo.gd
          run_test tests/test_hud_quick.gd
          run_test tests/test_connections.gd
          run_test tests/test_road_tools.gd
          run_test tests/test_detail_floor.gd
          run_test tests/test_grid_fill.gd
          run_test tests/test_move_it.gd
          run_test tests/test_road_variants.gd
          run_test tests/test_traffic.gd
          run_test tests/test_signal_timing.gd
          run_test tests/test_money_exact.gd
          run_test tests/test_green_light.gd
          run_test tests/test_traffic_center.gd
          run_test tests/test_level_needs.gd
          run_test tests/test_weather.gd
          run_test tests/test_parking.gd
          run_test tests/test_net.gd
          run_test tests/test_catch_up.gd
          run_test tests/test_postcard.gd
          run_test tests/test_vehicles.gd
          run_test tests/test_seasons.gd
          run_test tests/test_sun_path.gd
          run_test tests/test_menu_life.gd
          run_test tests/test_home_screen.gd
          run_test tests/test_balance.gd
          run_test tests/test_audio.gd
          run_test tests/test_sound_mix.gd
          run_test tests/test_transit.gd
          run_test tests/test_loading.gd
          run_test tests/test_terrain.gd
          run_test tests/test_permits.gd
          run_test tests/test_subdivisions.gd
          run_test tests/test_land_plan.gd
          run_test tests/test_street_age.gd
          run_test tests/test_engineer.gd
          run_test tests/test_rail.gd
          run_test tests/test_rail_grain.gd
          run_test tests/test_farm_roads.gd
          run_test tests/test_capital.gd
          run_test tests/test_livestock.gd
          run_test tests/test_families.gd
          run_test tests/test_streets.gd
          run_test tests/test_lots.gd
          run_test tests/test_lot_sync.gd
          run_test tests/test_building_types.gd
          run_test tests/test_market.gd
          run_test tests/test_hubs.gd
          run_test tests/test_boxed_hubs.gd
          run_test tests/test_boxed_mail.gd
          run_test tests/test_warehouses.gd
          run_test tests/test_big_factories.gd
          run_test tests/test_parks.gd
          run_test tests/test_boxed_parks.gd
          run_test tests/test_tourism.gd
          run_test tests/test_trails.gd
          run_test tests/test_power.gd
          run_test tests/test_vegetation.gd
          run_test tests/test_tree_growth.gd
          run_test tests/test_tree_lod.gd
          run_test tests/test_education.gd
          run_test tests/test_boxed_campus.gd
          run_test tests/test_boxed_edges_fuzz.gd
          run_test tests/test_telecom.gd
          run_test tests/test_banks.gd
          run_test tests/test_mail.gd
          run_test tests/test_economy.gd
          run_test tests/test_construction.gd
          run_test tests/test_builders.gd
          run_test tests/test_telemetry.gd
          run_test tests/test_pollution.gd
          run_test tests/test_placement_hints.gd
          run_test tests/test_road_warning.gd
          run_test tests/test_resource_bands.gd
          run_test tests/test_health.gd
          run_test tests/test_town_life.gd
          run_test tests/test_interlocal.gd
          run_test tests/test_regional.gd
          run_test tests/test_desktop.gd
          run_test tests/test_heritage.gd
          run_test tests/test_charter.gd
          run_test tests/test_crops.gd
          run_test tests/test_crop_calendar.gd
          run_test tests/test_farmsteads.gd
          run_test tests/test_farm_view.gd
          run_test tests/test_stats.gd
          run_test tests/test_upgrade_art.gd
          run_test tests/test_house_drawing.gd
          run_test tests/test_house_lots.gd
          run_test tests/test_lot_grade.gd

      - name: Stamp the build
        run: |
          # Shown in the game's corner so you can tell which version you're playing.
          python3 tools/stamp_build.py

      - name: Export for the web
        run: |
          mkdir -p build/web
          ~/godot-cache/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Name files by what's inside them
        run: |
          # File names come from what's inside each file. The engine (js, wasm
          # and audio worklets) only changes with the Godot version, so the
          # browser keeps it between builds and only the game data (pck)
          # downloads again after a merge.
          cd build/web
          e=engine-$(cat index.js index.wasm | sha256sum | cut -c1-10)
          g=game-$(sha256sum index.pck | cut -c1-10)
          v=${GITHUB_SHA::8}
          for f in index.*; do
            case "$f" in
              index.html) ;;
              index.pck) mv "$f" "$g.pck" ;;
              index.js|index.wasm|index.audio.*) mv "$f" "$e.${f#index.}" ;;
              *) mv "$f" "index-$v.${f#index.}" ;;
            esac
          done
          sed -i -E "s/index\.(icon|apple-touch-icon|png)/index-$v.\1/g; s/\"index\.js\"/\"$e.js\"/g; s/\"index\.pck\"/\"$g.pck\"/; s/\"index\.wasm\"/\"$e.wasm\"/; s/\"executable\":\"index\"/\"executable\":\"$e\",\"mainPack\":\"$g.pck\"/" index.html
          grep -q "src=\"$e.js\"" index.html
          grep -q "\"mainPack\":\"$g.pck\"" index.html
          grep -q "\"$e.wasm\":" index.html
          ls

      - name: Add the desktop download page
        run: |
          mkdir -p build/web/download
          cp web/download.html build/web/download/index.html
          cp assets/brand/logos/neighbors-horizontal-on-dark.png build/web/download/logo.png
          cp web/download-mac-blocked.png build/web/download/mac-blocked.png

      - name: Add the Sound picker's options
        run: |
          mkdir -p build/web/sfx
          cp -r web/sfx/. build/web/sfx/
          rm -f build/web/sfx/.gdignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
