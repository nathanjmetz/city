# Zones 1000 made-up towns (grids, curves, skewed crossings, triangles,
# deep blocks, odd land) in random click, drag and brush orders, with homes
# going up between clicks, and scores every lot (tools/zoning_stress.gd).
# The summary page ranks the lot-shape problems found; the run turns red when
# a problem shows up in more towns than tools/zoning_stress_budgets.json
# allows, so lot planning can only get better.
name: Zoning stress

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/sim/lot_planner.gd
      - scripts/sim/city_sim.gd
      - scripts/sim/zone_map.gd
      - scripts/roads/**
      - tools/zoning_stress.gd
      - tools/zoning_stress_budgets.json
      - .github/workflows/zoning-stress.yml
  workflow_dispatch:
    inputs:
      count:
        description: Scenarios
        default: "1000"

permissions:
  contents: read

concurrency:
  group: zoning-stress-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  COUNT: ${{ github.event.inputs.count || '1000' }}

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-perf
          key: godot-${{ env.GODOT_VERSION }}-perf

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-perf && cd ~/godot-perf
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot

      - name: Zone 1000 towns
        run: |
          ~/godot-perf/godot --headless --import >/dev/null 2>&1 || true
          # Four at once, one per core.
          for k in 0 1 2 3; do
            ~/godot-perf/godot --headless -s tools/zoning_stress.gd -- --count="$COUNT" --shard=$k/4 --pngs=1 --out=out/s$k > out-$k.log 2>&1 &
          done
          wait
          for k in 0 1 2 3; do
            if grep -q "SCRIPT ERROR" out-$k.log; then
              grep -A8 "SCRIPT ERROR" out-$k.log | head -40
              echo "::error::zoning stress shard $k hit a script error"
              exit 1
            fi
          done

      - name: Rank the problems and check the budgets
        run: |
          rc=0
          ~/godot-perf/godot --headless -s tools/zoning_stress.gd -- \
            --merge=out/s0/report.json,out/s1/report.json,out/s2/report.json,out/s3/report.json \
            --budgets=tools/zoning_stress_budgets.json --out=out > merge.log 2>&1 || rc=$?
          cat merge.log
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          grep "OVER BUDGET" merge.log >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoning-stress-${{ github.sha }}
          path: out/
