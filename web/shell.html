<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500&family=Outfit:wght@600&display=swap" rel="stylesheet">
		<style>
/* The Neighbors loading screen while the game downloads. It matches the
   in-game LoadingScreen (scripts/ui/loading_screen.gd): the House mark fills
   from the foundation to the roof with real download progress. */
:root {
	--surface: #10272b;
	--surface-raised: #1f454c;
	--surface-sunken: #0c1f22;
	--ink: #f6f4ef;
	--ink-muted: #a9c1c0;
	--mint: #8fcfbf;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--ink);
	background-color: var(--surface);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background: var(--surface);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	transition: opacity 0.45s ease;
	font-family: Figtree, system-ui, sans-serif;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#mark {
	width: clamp(120px, min(30vh, 40vw), 260px);
	height: auto;
	overflow: visible;
}

#mark .ghost { fill: var(--surface-raised); stroke: var(--surface-raised); }

#title {
	margin-top: 0.4em;
	font: 600 clamp(24px, min(6vh, 8vw), 52px)/1 Outfit, system-ui, sans-serif;
	letter-spacing: -0.01em;
}

#bar {
	margin-top: 18px;
	width: clamp(144px, min(36vh, 48vw), 312px);
	height: 4px;
	background: var(--surface-sunken);
}

#bar-fill {
	height: 100%;
	width: 0;
	background: var(--mint);
}

#status-text {
	margin-top: 10px;
	font-size: 14px;
	color: var(--ink-muted);
	font-variant-numeric: tabular-nums;
}

#status-notice {
	display: none;
	margin: 24px 2rem 0;
	max-width: 32rem;
	padding: 1rem;
	border-radius: 10px;
	border: 1px solid #ff6b8a;
	color: var(--ink);
	background: var(--surface-raised);
	line-height: 1.4;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<svg id="mark" viewBox="0 0 512 512" aria-hidden="true">
				<defs>
					<path id="c0" d="M61.23 445.69L228.30 445.69L228.30 284.35L86.00 207.98L61.23 228.62Z"/>
					<path id="c1" d="M283.70 445.69L450.77 445.69L450.77 228.62L426.00 207.98L283.70 284.35Z"/>
					<path id="c2" d="M380.11 169.73L256.00 66.31L131.89 169.73L256.00 236.34Z"/>
					<clipPath id="front"><path id="front-wave"/></clipPath>
					<clipPath id="back"><path id="back-wave"/></clipPath>
				</defs>
				<g stroke-width="30.22" stroke-linejoin="round" id="lift">
					<use href="#c0" class="ghost"/><use href="#c1" class="ghost"/><use href="#c2" class="ghost"/>
					<g clip-path="url(#back)" opacity="0.35">
						<use href="#c0" fill="#3a9a94" stroke="#3a9a94"/>
						<use href="#c1" fill="#ef6f51" stroke="#ef6f51"/>
						<use href="#c2" fill="#8fcfbf" stroke="#8fcfbf"/>
					</g>
					<g clip-path="url(#front)">
						<use href="#c0" fill="#3a9a94" stroke="#3a9a94"/>
						<use href="#c1" fill="#ef6f51" stroke="#ef6f51"/>
						<use href="#c2" fill="#8fcfbf" stroke="#8fcfbf"/>
					</g>
				</g>
			</svg>
			<div id="title">Neighbors</div>
			<div id="bar"><div id="bar-fill"></div></div>
			<div id="status-text">Getting the town ready</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');
	const barFill = document.getElementById('bar-fill');
	const frontWave = document.getElementById('front-wave');
	const backWave = document.getElementById('back-wave');
	const lift = document.getElementById('lift');

	// Same numbers as loading_screen.gd.
	const BOTTOM = 445.69 + 15.11;
	const TOP = 66.31 - 15.11;
	let target = 0;
	let shown = 0;
	let finishing = false;
	let doneAt = -1;
	let label = 'Getting the town ready';
	let last = performance.now();
	let time = 0;
	let running = true;

	function surface(level, amp, phase) {
		let d = '';
		for (let i = 0; i <= 32; i++) {
			const x = -20 + i * 552 / 32;
			const y = level + Math.sin(x * 0.024 + phase) * amp + Math.sin(x * 0.051 - phase * 0.6) * amp * 0.35;
			d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
		}
		return d + 'L532 600L-20 600Z';
	}

	function frame(now) {
		if (!running) {
			return;
		}
		const dt = Math.min(0.1, (now - last) / 1000);
		last = now;
		time += dt;
		const gap = target - shown;
		if (gap > 0) {
			shown = Math.min(target, shown + Math.max(gap * (1 - Math.exp(-dt / 0.25)), dt * 0.08));
		}
		const level = BOTTOM + (TOP - BOTTOM) * shown;
		const amp = 7 * (1 - shown * 0.85);
		frontWave.setAttribute('d', surface(level, amp, -time * 1.9));
		backWave.setAttribute('d', surface(level - 5, amp * 0.8, time * 1.3 + 1.7));
		barFill.style.width = (shown * 100).toFixed(2) + '%';
		statusText.textContent = label + '  ·  ' + Math.floor(shown * 100 + 0.0001) + '%';
		if (finishing && shown >= 1 && doneAt < 0) {
			doneAt = time;
		}
		if (doneAt >= 0) {
			const t = Math.min(1, (time - doneAt) / 0.35);
			lift.setAttribute('transform', 'translate(0 ' + (-Math.sin(t * Math.PI) * 15).toFixed(1) + ')');
			if (time - doneAt > 0.35 && !statusOverlay.classList.contains('done')) {
				statusOverlay.classList.add('done');
				setTimeout(() => {
					running = false;
					statusOverlay.remove();
				}, 500);
			}
		}
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);

	function setStatusNotice(text) {
		running = false;
		statusNotice.textContent = text;
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('This browser is missing features the game needs:\n' + missing.join('\n'));
		}
	} else {
		label = 'Downloading the town';
		// Load timings for the game's telemetry: a slow line vs. a slow start.
		window.nbLoad = { start: performance.now(), downloaded: 0, started: 0, bytes: 0 };
		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0 && current >= total && !window.nbLoad.downloaded) {
					window.nbLoad.downloaded = performance.now();
					window.nbLoad.bytes = total;
				}
				if (current > 0 && total > 0) {
					// The download is most of the wait; starting up takes the last bit.
					target = Math.max(target, Math.min(0.9, 0.9 * current / total));
				}
			},
		}).then(() => {
			window.nbLoad.started = performance.now();
			label = 'Opening the front door';
			target = 1;
			finishing = true;
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
